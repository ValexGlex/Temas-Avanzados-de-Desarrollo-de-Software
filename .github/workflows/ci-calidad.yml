name: CI y Calidad de Código

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-analyze:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Importante para que SonarCloud analice todo el historial

      # 2. Configurar Python
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # 3. Instalar dependencias (CORREGIDO: Alineación del guion)
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "django>=4.2,<5.0"
          pip install pandas numpy matplotlib seaborn plotly
          pip install "psycopg[binary]"
          pip install djongo
          pip install dnspython
          pip install flake8
          pip install pytest pytest-cov

      # 4. Ejecutar Pruebas con cobertura
      - name: Ejecutar Tests con cobertura
        run: |
          pytest --cov=. --cov-report=xml || echo "No se encontraron pruebas, continuando..."

      # 5. Análisis de SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=tecmaribel
            -Dsonar.projectKey=tecmaribel
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=.
